# Test every push; if tests pass, stamp the offline-cache version and publish to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (8 screen sizes)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp cache version with the commit
        run: |
          sed -i -E "s/const VERSION = '[^']*'/const VERSION = 'onepot-${GITHUB_SHA::8}'/" sw.js
          grep -n "const VERSION" sw.js
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css favicon.svg manifest.webmanifest sw.js .nojekyll LICENSE _site/
          cp recipes.js i18n.js core.js app.js features.js _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
